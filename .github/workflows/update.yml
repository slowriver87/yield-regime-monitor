name: Update data

on:
  schedule:
    # Weekdays: evening, late evening and the next morning, ET (Treasury posts the day's curves late)
    - cron: "20 23 * * 1-5"
    - cron: "20 2 * * 2-6"
    - cron: "20 12 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: fetch, parse and check, but commit nothing"
        type: boolean
        default: true
      skip_seed_checks:
        description: "Accept source values that differ from the seeded page values (review the dry run first)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      SKIP_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_seed_checks }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Fetch, check and rebuild
        id: update
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Contact for the BLS and DOL User-Agent only. A secret, so GitHub masks it in the step header;
          # the script never prints it. (The Commit step keeps vars.COMMIT_EMAIL for the author.)
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          args=(--commit-msg "$RUNNER_TEMP/commit-msg.txt" --issue-body "$RUNNER_TEMP/issue-body.md")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$SKIP_SEED" = "true" ]; then args+=(--skip-seed-checks); fi
          python scripts/update.py "${args[@]}"

      - name: Commit
        if: steps.update.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          if [ -z "$COMMIT_NAME" ] || [ -z "$COMMIT_EMAIL" ]; then
            echo "Repository variables COMMIT_NAME and COMMIT_EMAIL must be set." >&2
            exit 1
          fi
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add index.html data/summary.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          git push

      - name: Open or comment on issue
        # A failed run (nothing committed), or a committed update with nulled values or large level moves
        if: (failure() || steps.update.outputs.attention == 'true') && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Data update needs attention
        run: |
          {
            if [ -s "$RUNNER_TEMP/issue-body.md" ]; then
              cat "$RUNNER_TEMP/issue-body.md"
            else
              echo "The data update failed before its checks ran. No changes were committed."
            fi
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          num=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
